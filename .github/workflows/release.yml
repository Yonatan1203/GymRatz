name: Release Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        default: both
        options:
          - both
          - android
          - ios
      build_number:
        description: 'Build number — must be higher than last upload (e.g. 28). Leave blank to use pubspec.'
        required: false
        type: string
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  build-android:
    needs: analyze
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        # tr -d strips any whitespace (wrapped/indented/CRLF base64) before decode;
        # GNU `base64 --decode` rejects embedded spaces with "invalid input".
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 --decode > android/app/gymratz-release.keystore

      - name: Create key.properties
        run: |
          printf '%s\n' \
            "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" \
            "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" \
            "storeFile=gymratz-release.keystore" \
            > android/key.properties

      - name: Build AAB
        # RC_APPLE_KEY secret name is RC_APPLE_KEY (REVENUECAT_APPLE_KEY is not configured).
        # build_number (when provided via dispatch) overrides the pubspec version
        # code so each Play upload gets a unique, higher code. Tag-push builds
        # leave it blank and fall back to pubspec.
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ARGS=""
          if [ -n "$BUILD_NUMBER" ]; then ARGS="--build-number=$BUILD_NUMBER"; fi
          flutter build appbundle --release $ARGS \
            --dart-define=RC_GOOGLE_KEY=${{ secrets.REVENUECAT_GOOGLE_KEY }} \
            --dart-define=RC_APPLE_KEY=${{ secrets.RC_APPLE_KEY }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Play Store (Internal Testing)
        # `secrets` context is NOT available in `if:` (causes a workflow startup/validation
        # failure). Map the secret to env and gate on env instead.
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gymratz.gymratz
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal

  build-ios:
    needs: analyze
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: flutter pub get

      - name: Set up App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          cp ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.appstoreconnect/private_keys/

      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_BASE64 }}
        run: echo "$GOOGLE_SERVICE_INFO_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Inject Google Sign-In client IDs
        run: |
          CLIENT_ID=$(plutil -extract CLIENT_ID raw ios/Runner/GoogleService-Info.plist)
          REVERSED_CLIENT_ID=$(plutil -extract REVERSED_CLIENT_ID raw ios/Runner/GoogleService-Info.plist)
          plutil -replace GIDClientID -string "$CLIENT_ID" ios/Runner/Info.plist
          plutil -replace CFBundleURLTypes -json "[{\"CFBundleTypeRole\":\"Editor\",\"CFBundleURLSchemes\":[\"$REVERSED_CLIENT_ID\"]}]" ios/Runner/Info.plist
          sed -i '' "s|__IOS_CLIENT_ID__|$CLIENT_ID|g" lib/firebase_options.dart
          echo "Injected CLIENT_ID and REVERSED_CLIENT_ID"

      - name: Build Flutter iOS (no codesign)
        env:
          RC_APPLE_KEY: ${{ secrets.RC_APPLE_KEY }}
        run: |
          BUILD_NUMBER="${{ inputs.build_number }}"
          ARGS=""
          if [ -n "$BUILD_NUMBER" ]; then ARGS="--build-number=$BUILD_NUMBER"; fi
          flutter build ios --release $ARGS \
            --dart-define=RC_APPLE_KEY=$RC_APPLE_KEY \
            --no-codesign

      - name: Create unsigned archive
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/ios/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA (signed, with retry)
        run: |
          for attempt in 1 2 3 4; do
            echo "::group::Export attempt $attempt"
            if xcodebuild -exportArchive \
              -archivePath build/ios/Runner.xcarchive \
              -exportPath build/ios/ipa \
              -exportOptionsPlist ios/ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
              -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
              -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}; then
              echo "::endgroup::"; echo "Export succeeded on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "Export attempt $attempt failed; retrying in 25s..."
            rm -rf build/ios/ipa
            sleep 25
          done
          echo "Export failed after 4 attempts"; exit 1

      - name: Upload to TestFlight (fastlane, with retry)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          IPA_PATH="$(ls "$GITHUB_WORKSPACE"/build/ios/ipa/*.ipa | head -n1)"
          echo "Uploading: $IPA_PATH"
          cd ios
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt"
            if BUNDLE_GEMFILE="$GITHUB_WORKSPACE/Gemfile" bundle exec fastlane ios upload_testflight ipa:"$IPA_PATH"; then
              echo "Upload succeeded on attempt $attempt"; exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "Upload failed after 3 attempts"; exit 1

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymratz-ios-release
          path: build/ios/ipa/*.ipa

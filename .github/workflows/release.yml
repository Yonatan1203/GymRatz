name: Release Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      build_number:
        description: 'Android version code — must be higher than the last uploaded (e.g. 17). Leave blank to use pubspec.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  build-android:
    needs: analyze
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        # tr -d strips any whitespace (wrapped/indented/CRLF base64) before decode;
        # GNU `base64 --decode` rejects embedded spaces with "invalid input".
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 --decode > android/app/gymratz-release.keystore

      - name: Create key.properties
        run: |
          printf '%s\n' \
            "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" \
            "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" \
            "storeFile=gymratz-release.keystore" \
            > android/key.properties

      - name: Build AAB
        # RC_APPLE_KEY secret name is RC_APPLE_KEY (REVENUECAT_APPLE_KEY is not configured).
        # build_number (when provided via dispatch) overrides the pubspec version
        # code so each Play upload gets a unique, higher code. Tag-push builds
        # leave it blank and fall back to pubspec.
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ARGS=""
          if [ -n "$BUILD_NUMBER" ]; then ARGS="--build-number=$BUILD_NUMBER"; fi
          flutter build appbundle --release $ARGS \
            --dart-define=RC_GOOGLE_KEY=${{ secrets.REVENUECAT_GOOGLE_KEY }} \
            --dart-define=RC_APPLE_KEY=${{ secrets.RC_APPLE_KEY }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Play Store (Internal Testing)
        # `secrets` context is NOT available in `if:` (causes a workflow startup/validation
        # failure). Map the secret to env and gate on env instead.
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gymratz.gymratz
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal

  # iOS release is handled by the dedicated `ios-release.yml` workflow, which uses the
  # App Store Connect API key (the secrets that are actually configured). The previous
  # build-ios job here relied on a manual cert/profile keychain flow with secrets that
  # do not exist (APPLE_CERTIFICATE_*, APPLE_API_KEY_P8) and used `secrets` in `if:`,
  # which made this workflow fail to validate. Removed to consolidate on one iOS pipeline.

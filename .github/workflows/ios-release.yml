name: iOS Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (e.g. 17)'
        required: true
        type: string

jobs:
  build-ios:
    # macos-26 ships Xcode 26 / iOS 26 SDK, which Apple now requires for App Store
    # Connect uploads ("built with the iOS 18.5 SDK ... must be built with the iOS 26
    # SDK or later"). macos-latest still defaulted to Xcode 16.4.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Apple requires the iOS 26 SDK for uploads)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          # altool/notarytool also look here for the key; copy so discovery cannot fail
          cp ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          # Create API key JSON for xcodebuild
          cat > ~/.private_keys/api_key.json << EOJSON
          {
            "key_id": "$APP_STORE_CONNECT_KEY_ID",
            "issuer_id": "$APP_STORE_CONNECT_ISSUER_ID",
            "key": "$(cat ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 | base64)",
            "in_house": false
          }
          EOJSON

      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Inject Google Sign-In client IDs
        run: |
          CLIENT_ID=$(plutil -extract CLIENT_ID raw ios/Runner/GoogleService-Info.plist)
          REVERSED_CLIENT_ID=$(plutil -extract REVERSED_CLIENT_ID raw ios/Runner/GoogleService-Info.plist)
          plutil -replace GIDClientID -string "$CLIENT_ID" ios/Runner/Info.plist
          plutil -replace CFBundleURLTypes -json "[{\"CFBundleTypeRole\":\"Editor\",\"CFBundleURLSchemes\":[\"$REVERSED_CLIENT_ID\"]}]" ios/Runner/Info.plist
          sed -i '' "s|__IOS_CLIENT_ID__|$CLIENT_ID|g" lib/firebase_options.dart
          echo "Injected CLIENT_ID and REVERSED_CLIENT_ID"

      - name: Build Flutter iOS (no codesign)
        env:
          RC_APPLE_KEY: ${{ secrets.RC_APPLE_KEY }}
        run: |
          flutter build ios --release \
            --build-number=${{ inputs.build_number }} \
            --dart-define=RC_APPLE_KEY=$RC_APPLE_KEY \
            --dart-define=ENV=prod \
            --no-codesign

      - name: Create unsigned archive
        # Archive WITHOUT code signing. All signing (Runner app + embedded pod
        # frameworks) happens at *export* time with the App Store distribution
        # profile, which the App Store Connect API key + -allowProvisioningUpdates
        # creates on the Export step. Signing at archive time fails on CI because:
        #   - passing CODE_SIGN_IDENTITY="Apple Distribution" globally poisons the
        #     CocoaPods targets (xcodebuild exit 65, "conflicting provisioning"); and
        #   - leaving the Runner target's automatic signing on makes Xcode try to
        #     create an "iOS App Development" profile, which needs registered devices
        #     the CI team doesn't have ("no devices ... no profiles for ...").
        # Distribution (app-store) profiles need no devices, so we defer to export.
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/ios/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        # Export signs the app + embedded frameworks for app-store distribution using
        # the API key (-allowProvisioningUpdates creates the distribution cert/profile).
        # This contacts App Store Connect, which intermittently returns -1009
        # "Internet connection appears to be offline" — retry a few times before failing.
        run: |
          for attempt in 1 2 3 4; do
            echo "::group::Export attempt $attempt"
            if xcodebuild -exportArchive \
              -archivePath build/ios/Runner.xcarchive \
              -exportPath build/ios/ipa \
              -exportOptionsPlist ios/ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
              -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
              -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}; then
              echo "::endgroup::"; echo "Export succeeded on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "Export attempt $attempt failed; retrying in 25s..."
            rm -rf build/ios/ipa
            sleep 25
          done
          echo "Export failed after 4 attempts"; exit 1

      - name: Install Fastlane
        run: bundle install

      - name: Upload to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          IPA_PATH="$(pwd)/$(ls build/ios/ipa/*.ipa | head -n1)"
          echo "Uploading: $IPA_PATH"
          cd ios && bundle exec fastlane ios upload_testflight ipa:"$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymratz-ios-release
          path: build/ios/ipa/*.ipa

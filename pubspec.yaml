name: gymratz
description: "GymRatz - Track workouts, smash PRs, level up your fitness"
publish_to: 'none'
version: 1.2.0+18

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_screenutil: ^5.9.3
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.9
  shared_preferences: ^2.5.3
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_analytics: ^11.4.2
  firebase_crashlytics: ^4.3.2
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.6.5
  purchases_flutter: ^8.5.1
  google_sign_in: ^6.2.2
  uuid: ^4.5.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  url_launcher: ^6.3.1
  purchases_ui_flutter: ^8.11.0
  add_2_calendar: ^3.0.1
  share_plus: ^10.1.4
  package_info_plus: ^8.1.3
  cloud_functions: ^5.3.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  fake_cloud_firestore: ^3.1.0
  mocktail: ^0.3.0
  firebase_auth_mocks: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "transparent"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#003A6B"
  image: "assets/icon/app_icon.png"
  android: true
  ios: true
  android_12:
    color: "#003A6B"
    image: "assets/icon/app_icon.png"
